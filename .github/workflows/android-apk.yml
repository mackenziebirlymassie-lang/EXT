name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Android assets and verify tests
        run: |
          npm run android:sync
          npm test

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfcc-finance-os-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          CP_PATH="PFCC-V2-${GITHUB_REF_NAME}-debug.apk"
          cp "$APK_PATH" "$CP_PATH"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$CP_PATH" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$CP_PATH" \
              --title "PFCC V2 (${GITHUB_REF_NAME})" \
              --generate-notes
          fi
