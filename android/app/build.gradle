plugins {
    id("com.android.application")
}

def webRootDir = rootProject.projectDir.parentFile
def webAssetsOutDir = file("${projectDir}/src/main/assets/www")

tasks.register("syncWebAssets", Copy) {
    description = "Copies EXT root web files into Android assets/www before compilation."
    doFirst {
        delete(webAssetsOutDir)
    }
    from(webRootDir) {
        include("index.html", "style.css", "favicon.svg", "js/*.js")
    }
    into(webAssetsOutDir)
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}

def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace = "org.pfcc.financeos"
    compileSdk = 35

    defaultConfig {
        applicationId = "org.pfcc.financeos"
        minSdk = 24
        targetSdk = 35
        versionCode = ciBuildNumber
        versionName = "2.0.${ciBuildNumber}"
        buildConfigField "int", "APP_BUILD_NUMBER", "${ciBuildNumber}"
        buildConfigField "String", "UPDATE_API_URL", "\"https://api.github.com/repos/mackenziebirlymassie-lang/EXT/releases/tags/latest\""
    }

    flavorDimensions += "distribution"
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "boolean", "ENABLE_SELF_UPDATE", "true"
        }
        playstore {
            dimension "distribution"
            buildConfigField "boolean", "ENABLE_SELF_UPDATE", "false"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            def ksPath = System.getenv("PFCC_DEBUG_KEYSTORE")
            if (ksPath) {
                def ksFile = file(ksPath)
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword System.getenv("PFCC_DEBUG_STORE_PASS") ?: "android"
                    keyAlias System.getenv("PFCC_DEBUG_KEY_ALIAS") ?: "androiddebugkey"
                    keyPassword System.getenv("PFCC_DEBUG_KEY_PASS") ?: "android"
                    enableV1Signing = true
                    enableV2Signing = true
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
}
